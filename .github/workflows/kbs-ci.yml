name: KBS-TECH CI
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Core tests
        run: python -m unittest discover -s tests -v
      - name: Validate M7 contract files
        run: |
          python -m json.tool benchmarks/m7_contract.json >/dev/null
          python -m json.tool benchmarks/m7_tasks.json >/dev/null
      - name: M7 readiness
        run: |
          python benchmarks/run_m7.py || code=$?
          if [ "${code:-0}" -eq 0 ]; then exit 0; fi
          echo "M7 provider execution remains intentionally gated."
