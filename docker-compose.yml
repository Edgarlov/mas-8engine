version: "3.8"

services:
  ontology-saas-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ontology_saas_api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
