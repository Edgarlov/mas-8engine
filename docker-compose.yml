version: '3.8'

services:
  backend:
    build:
      context: ./mas_8engine
      dockerfile: Dockerfile
    container_name: mas8_backend
    ports:
      - "8000:8000"
    environment:
      - MAS8_API_HOST=http://localhost:8000
      - MAS8_LOG_LEVEL=INFO
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    build:
      context: ./frontend_agentic
      dockerfile: Dockerfile
    container_name: mas8_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_HOST=http://backend:8000
    depends_on:
      - backend
    restart: always
